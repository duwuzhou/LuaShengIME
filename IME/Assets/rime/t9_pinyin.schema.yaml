# Rime schema
# encoding: utf-8

schema:
  schema_id: t9_pinyin
  name: T9拼音
  version: "1.0"
  author:
    - LuaShengIME
  description: |
    九宫格T9拼音输入方案。
    按数字键2-9自动匹配拼音候选。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, ABC ]
  - options: [ zh_trad, zh_simp ]
    reset: 1
    states: [ 繁體, 简体 ]

engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@zh_simp
    - uniquifier

speller:
  alphabet: "23456789"
  delimiter: " "
  algebra:
    - "erase/^xx$/"
    - "xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/"

translator:
  dictionary: luna_pinyin
  prism: t9_pinyin

zh_simp:
  option_name: zh_simp
  opencc_config: opencc/t2s.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
